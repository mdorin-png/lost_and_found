{% extends "base.html" %}
{% block title %}Report Lost Item{% endblock %}

{% block content %}
<h1>Report a Lost Item</h1>
<p>Provide your contact information so a possible match can generate a notification.</p>

<form method="post" class="form">
    <label>Name
        <input name="student_name" value="{{ form.get('student_name', '') }}" required>
    </label>

    <label>Contact
        <input name="contact" value="{{ form.get('contact', '') }}" required>
    </label>

    <label>Description
        <textarea name="description" required>{{ form.get('description', '') }}</textarea>
    </label>

    <label>Category
        <input name="category" value="{{ form.get('category', '') }}" placeholder="e.g. Backpack" required>
    </label>

    <label>Location
        <input name="location" value="{{ form.get('location', '') }}" placeholder="e.g. Library" required>
    </label>

    <button type="submit">Submit Lost Report</button>
</form>
{% endblock %}
