{% extends "base.html" %}
{% block title %}Search{% endblock %}

{% block content %}
<div class="page-heading">
    <p class="eyebrow">Item search</p>
    <h1>Search found items</h1>
    <p>Use any detail you remember to check currently open reports.</p>
</div>

<form method="post" class="form">
    <label>Description
        <input name="description">
    </label>

    <label>Category
        <input name="category">
    </label>

    <label>Location
        <input name="location">
    </label>

    <button type="submit">Search</button>
</form>
{% endblock %}
