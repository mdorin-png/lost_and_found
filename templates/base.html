<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Lost and Found{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <nav class="nav">
        <a href="{{ url_for('controller.index') }}">Lost & Found</a>
        <div>
            <a href="{{ url_for('controller.report_lost') }}">Report Lost</a>
            <a href="{{ url_for('controller.report_found') }}">Report Found</a>
            <a href="{{ url_for('controller.search') }}">Search</a>
        </div>
    </nav>
</header>

<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>
</body>
</html>
