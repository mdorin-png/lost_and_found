<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Lost and Found{% endblock %} | Campus Services</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
    <div class="utility-bar">
        <div class="header-content utility-content">
            <span>Campus Services</span>
            <span>Lost &amp; Found Support</span>
        </div>
    </div>
    <nav class="nav header-content" aria-label="Main navigation">
        <a class="brand" href="{{ url_for('controller.index') }}" aria-label="Campus Lost and Found home">
            <span class="brand-mark" aria-hidden="true"><i></i><b></b></span>
            <span>LOST<span>&amp;</span>FOUND</span>
        </a>
        <div class="nav-links">
            <a href="{{ url_for('controller.report_lost') }}">Report lost</a>
            <a href="{{ url_for('controller.report_found') }}">Report found</a>
            <a href="{{ url_for('controller.search') }}">Search items</a>
        </div>
    </nav>
</header>

<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>
</body>
</html>
